name: cstore_mobile
version: 0.1.0+1
description: C-Store Mobile simplified UI-first Flutter starter
publish_to: none
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  path_provider_android: 2.2.22
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/
